[package]
name = "dck-eos-fiyat-endeksi"
version = "1.0.0"
description = "DÇK-EÖS Fiyat Endeksi — local-first desktop analytics"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
